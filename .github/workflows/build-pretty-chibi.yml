name: Build pretty textured Chibi model

on:
  # A push trigger lets this workflow run from a development branch before it
  # has been merged into the default branch (where manual dispatch appears).
  push:
    branches:
      - "arena/**"
    paths:
      - "Chibi_full.stl"
      - "scripts/enhance_chibi.py"
      - "scripts/merge_chibi.py"
      - "scripts/validate_stl.py"
      - ".github/workflows/build-pretty-chibi.yml"
  workflow_dispatch:
    inputs:
      voxel_size:
        description: "Voxel size for the higher-quality sculpted surface"
        required: true
        default: "0.14"
        type: string
      smooth_factor:
        description: "Gentle sculpt-smooth strength (lower keeps more original detail)"
        required: true
        default: "0.25"
        type: string
      smooth_iterations:
        description: "Gentle sculpt-smooth iterations"
        required: true
        default: "2"
        type: string
      texture_size:
        description: "Baked skin base-colour texture size"
        required: true
        default: "4096"
        type: string
      bake_samples:
        description: "Cycles samples used while baking the skin textures"
        required: true
        default: "8"
        type: string
      render_samples:
        description: "Cycles samples for the preview renders"
        required: true
        default: "32"
        type: string
      render_width:
        description: "Preview render width in pixels (height is 4:3)"
        required: true
        default: "800"
        type: string
      commit_results:
        description: "Commit generated model files back to the selected branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# Share the base build's group/format so branch-writing model builds are
# intentionally serialized as far as GitHub concurrency groups allow.
concurrency:
  group: build-chibi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pretty:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      BLENDER_VERSION: "4.2.0"
      VOXEL_SIZE: ${{ inputs.voxel_size || '0.14' }}
      SMOOTH_FACTOR: ${{ inputs.smooth_factor || '0.25' }}
      SMOOTH_ITERATIONS: ${{ inputs.smooth_iterations || '2' }}
      TEXTURE_SIZE: ${{ inputs.texture_size || '4096' }}
      BAKE_SAMPLES: ${{ inputs.bake_samples || '8' }}
      RENDER_SAMPLES: ${{ inputs.render_samples || '32' }}
      RENDER_WIDTH: ${{ inputs.render_width || '800' }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pillow>=10,<12"

      - name: Install Blender system libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            xz-utils \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxinerama1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxrandr2 \
            libxrender1 \
            libxxf86vm1 \
            libwayland-client0 \
            libwayland-cursor0

      - name: Download official Blender
        run: |
          set -euo pipefail
          BLENDER_MINOR="${BLENDER_VERSION%.*}"
          BLENDER_DIR="$RUNNER_TEMP/blender-$BLENDER_VERSION"
          ARCHIVE="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender${BLENDER_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

          mkdir -p "$BLENDER_DIR"
          curl --fail --location --retry 3 "$URL" --output "$ARCHIVE"
          tar -xJf "$ARCHIVE" --strip-components=1 -C "$BLENDER_DIR"
          echo "BLENDER=$BLENDER_DIR/blender" >> "$GITHUB_ENV"
          xvfb-run -a "$BLENDER_DIR/blender" --version

      - name: Sculpt, texture and render the pretty model in Blender
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          voxel_size = float(os.environ["VOXEL_SIZE"])
          smooth_factor = float(os.environ["SMOOTH_FACTOR"])
          smooth_iterations = int(os.environ["SMOOTH_ITERATIONS"])
          texture_size = int(os.environ["TEXTURE_SIZE"])
          bake_samples = int(os.environ["BAKE_SAMPLES"])
          render_samples = int(os.environ["RENDER_SAMPLES"])
          render_width = int(os.environ["RENDER_WIDTH"])
          if not 0.05 <= voxel_size <= 1.0:
              raise SystemExit("voxel_size must be between 0.05 and 1.0")
          if not 0.0 <= smooth_factor <= 1.0:
              raise SystemExit("smooth_factor must be between 0.0 and 1.0")
          if not 0 <= smooth_iterations <= 20:
              raise SystemExit("smooth_iterations must be between 0 and 20")
          if texture_size not in (512, 1024, 2048, 4096):
              raise SystemExit("texture_size must be 512, 1024, 2048 or 4096")
          if not 1 <= bake_samples <= 128:
              raise SystemExit("bake_samples must be between 1 and 128")
          if not 1 <= render_samples <= 512:
              raise SystemExit("render_samples must be between 1 and 512")
          if not 200 <= render_width <= 2000:
              raise SystemExit("render_width must be between 200 and 2000")
          print(
              f"voxel_size={voxel_size}, texture_size={texture_size}, "
              f"bake_samples={bake_samples}, render_samples={render_samples}, "
              f"render_width={render_width}"
          )
          PY

          xvfb-run -a -s "-screen 0 1024x768x24" "$BLENDER" \
            --background \
            --factory-startup \
            -noaudio \
            --python scripts/enhance_chibi.py \
            -- \
            --input "Chibi_full.stl" \
            --out-dir . \
            --voxel-size "$VOXEL_SIZE" \
            --smooth-factor "$SMOOTH_FACTOR" \
            --smooth-iterations "$SMOOTH_ITERATIONS" \
            --texture-size "$TEXTURE_SIZE" \
            --bake-samples "$BAKE_SAMPLES" \
            --render-samples "$RENDER_SAMPLES" \
            --render-width "$RENDER_WIDTH"

      - name: Validate geometry, textures and GLB
        run: |
          set -euo pipefail
          mkdir -p validation

          python scripts/validate_stl.py Chibi_pretty.stl \
            --require-watertight \
            --require-single-component \
            --require-positive-volume \
            --min-triangles 500000 \
            --json-out validation/Chibi_pretty.json

          python - <<'PY'
          import json
          import os
          import struct
          from pathlib import Path

          from PIL import Image

          expected = int(os.environ["TEXTURE_SIZE"])
          base = Path("textures/skin_basecolor.png")
          rough = Path("textures/skin_roughness.png")
          with Image.open(base) as image:
              base_size = image.size
          with Image.open(rough) as image:
              rough_size = image.size
          assert base_size == (expected, expected), base_size
          assert rough_size == (max(512, expected // 2), max(512, expected // 2)), rough_size

          glb_path = Path("Chibi_pretty.glb")
          data = glb_path.read_bytes()
          magic, version, length = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF" and version == 2 and length == len(data)
          chunk_length, chunk_type = struct.unpack_from("<I4s", data, 12)
          assert chunk_type == b"JSON"
          gltf = json.loads(data[20 : 20 + chunk_length])
          materials = gltf.get("materials", [])
          assert len(gltf.get("meshes", [])) == 1, gltf.get("meshes")
          assert len(gltf.get("images", [])) >= 2, gltf.get("images")
          assert len(gltf.get("textures", [])) >= 2, gltf.get("textures")
          pbr = materials[0].get("pbrMetallicRoughness", {})
          assert "baseColorTexture" in pbr, materials
          assert "metallicRoughnessTexture" in pbr, materials

          report = {
              "glb": str(glb_path),
              "bytes": len(data),
              "meshes": len(gltf.get("meshes", [])),
              "images": len(gltf.get("images", [])),
              "textures": len(gltf.get("textures", [])),
              "materials": materials,
              "basecolor_size": list(base_size),
              "roughness_size": list(rough_size),
          }
          out = Path("validation/Chibi_pretty_glb.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Show generated files in the job summary
        run: |
          set -euo pipefail
          {
            echo "## Pretty textured Chibi model"
            echo
            echo "- Sculpt voxel size: \`$VOXEL_SIZE\`"
            echo "- Skin texture: \`$TEXTURE_SIZE × $TEXTURE_SIZE\`"
            echo "- Preview samples: \`$RENDER_SAMPLES\`"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            for file in \
              Chibi_pretty.blend \
              Chibi_pretty.stl \
              Chibi_pretty.glb \
              Chibi_pretty_report.json \
              textures/skin_basecolor.png \
              textures/skin_roughness.png \
              preview/Chibi_pretty_front.png \
              preview/Chibi_pretty_threequarter.png \
              preview/Chibi_pretty_closeup.png
            do
              size="$(du -h "$file" | cut -f1)"
              echo "| \`$file\` | $size |"
            done
            echo
            echo "### Sculpted STL validation"
            echo
            echo '```json'
            cat validation/Chibi_pretty.json
            echo '```'
            echo
            echo "### GLB / texture validation"
            echo
            echo '```json'
            cat validation/Chibi_pretty_glb.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh \
            Chibi_pretty.blend \
            Chibi_pretty.stl \
            Chibi_pretty.glb \
            Chibi_pretty_report.json \
            textures/skin_basecolor.png \
            textures/skin_roughness.png \
            preview/Chibi_pretty_front.png \
            preview/Chibi_pretty_threequarter.png \
            preview/Chibi_pretty_closeup.png \
            validation/Chibi_pretty.json \
            validation/Chibi_pretty_glb.json

      - name: Upload pretty model as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chibi-pretty-model-${{ github.run_id }}
          path: |
            Chibi_pretty.blend
            Chibi_pretty.stl
            Chibi_pretty.glb
            Chibi_pretty_report.json
            textures/skin_basecolor.png
            textures/skin_roughness.png
            preview/Chibi_pretty_front.png
            preview/Chibi_pretty_threequarter.png
            preview/Chibi_pretty_closeup.png
            validation/Chibi_pretty.json
            validation/Chibi_pretty_glb.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated files to the selected branch
        if: ${{ github.event_name == 'push' || inputs.commit_results }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            Chibi_pretty.blend \
            Chibi_pretty.stl \
            Chibi_pretty.glb \
            Chibi_pretty_report.json \
            textures/skin_basecolor.png \
            textures/skin_roughness.png \
            preview/Chibi_pretty_front.png \
            preview/Chibi_pretty_threequarter.png \
            preview/Chibi_pretty_closeup.png

          if git diff --cached --quiet; then
            echo "Generated files are unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Build pretty textured Chibi model [skip ci]"

          # Another model workflow may have pushed to this development branch
          # while Cycles was rendering. Rebase and retry a few times; the two
          # builds write disjoint output files.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt was rejected; retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not push generated files after three attempts." >&2
          exit 1
