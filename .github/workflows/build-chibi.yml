name: Build unified Chibi model

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "body base.blend"
      - "Chibi_head.stl"
      - "scripts/merge_chibi.py"
      - "scripts/render_stl_preview.py"
      - ".github/workflows/build-chibi.yml"
  workflow_dispatch:
    inputs:
      head_scale:
        description: "Head scale (0.60 = balanced chibi proportions)"
        required: true
        default: "0.60"
        type: string
      voxel_size:
        description: "Voxel size for the fused watertight STL"
        required: true
        default: "0.30"
        type: string
      commit_results:
        description: "Commit generated model files back to the selected branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-chibi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BLENDER_VERSION: "4.2.0"
      HEAD_SCALE: ${{ inputs.head_scale || '0.60' }}
      VOXEL_SIZE: ${{ inputs.voxel_size || '0.30' }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check source parts existence
        id: check_sources
        run: |
          if [ ! -f "body base.blend" ] || [ ! -f "Chibi_head.stl" ]; then
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
            echo "Original separate parts ('body base.blend', 'Chibi_head.stl') are not present in this branch."
            echo "The unified Chibi_full model is already maintained in the repository."
          else
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python for validation and previews
        if: steps.check_sources.outputs.has_sources == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pillow>=10,<12"

      - name: Install Blender system libraries
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            xz-utils \
            xvfb \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libx11-6 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxrender1 \
            libxxf86vm1

      - name: Download official Blender
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          BLENDER_MINOR="${BLENDER_VERSION%.*}"
          BLENDER_DIR="$RUNNER_TEMP/blender-$BLENDER_VERSION"
          ARCHIVE="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          URL="https://download.blender.org/release/Blender${BLENDER_MINOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

          mkdir -p "$BLENDER_DIR"
          curl --fail --location --retry 3 "$URL" --output "$ARCHIVE"
          tar -xJf "$ARCHIVE" --strip-components=1 -C "$BLENDER_DIR"
          echo "BLENDER=$BLENDER_DIR/blender" >> "$GITHUB_ENV"
          xvfb-run -a "$BLENDER_DIR/blender" --version

      - name: Build the unified model in Blender
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1024x768x24" "$BLENDER" \
            --background \
            --factory-startup \
            -noaudio \
            --python scripts/merge_chibi.py \
            -- \
            --body "body base.blend" \
            --head "Chibi_head.stl" \
            --out-dir . \
            --head-scale "$HEAD_SCALE" \
            --voxel-size "$VOXEL_SIZE"

      - name: Validate STL files
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          mkdir -p validation preview
          python scripts/validate_stl.py Chibi_full.stl \
            --require-positive-volume \
            --min-triangles 90000 \
            --json-out validation/Chibi_full.json

      - name: Render preview views
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          set -euo pipefail
          python scripts/render_stl_preview.py \
            Chibi_full.stl \
            preview/Chibi_full_views.png

      - name: Commit generated files to the selected branch
        if: steps.check_sources.outputs.has_sources == 'true' && (github.event_name == 'push' || inputs.commit_results)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Chibi_full.blend Chibi_full.stl Chibi_full.glb Chibi_full_report.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Build unified Chibi model [skip ci]"
          git fetch origin "$TARGET_BRANCH"
          git rebase FETCH_HEAD
          git push origin "HEAD:$TARGET_BRANCH"
