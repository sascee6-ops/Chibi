name: Publish release assets

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID containing chibi-pretty-model artifact"
        required: true
        default: "42069145441"
        type: string
      release_tag:
        description: "GitHub release tag to upload assets into"
        required: true
        default: "v0.0.0.0.0.0-s0"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download model artifact from run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id || '42069145441' }}"
          echo "Downloading artifact from run $RUN_ID..."
          mkdir -p package
          gh run download "$RUN_ID" -D package
          find package -maxdepth 3 -ls

      - name: Build pure lossless 8K deliverables
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, struct, zipfile
          from pathlib import Path

          glb_matches = list(Path("package").rglob("Chibi_pretty.glb"))
          if not glb_matches:
              raise SystemExit("Chibi_pretty.glb not found in downloaded package")
          glb_path = glb_matches[0]
          pkg = glb_path.parent
          print(f"Found model root at: {pkg}")

          data = glb_path.read_bytes()
          magic, version, total = struct.unpack_from("<4sII", data, 0)
          json_len, _ = struct.unpack_from("<I4s", data, 12)
          gltf = json.loads(data[20 : 20 + json_len])
          bin_off = 20 + json_len
          bin_len, _ = struct.unpack_from("<I4s", data, bin_off)
          bin_start = bin_off + 8
          old_bin = data[bin_start : bin_start + bin_len]

          # Swap in the uncompressed 8K PNG master for baseColor
          basecolor_png = next(pkg.rglob("skin_basecolor.png"))
          png_bytes = basecolor_png.read_bytes()
          tex_idx = gltf["materials"][0]["pbrMetallicRoughness"]["baseColorTexture"]["index"]
          img_idx = gltf["textures"][tex_idx]["source"]
          image = gltf["images"][img_idx]
          view_idx = image["bufferView"]

          views = gltf["bufferViews"]
          order = sorted(range(len(views)), key=lambda i: views[i].get("byteOffset", 0))
          new_bin = bytearray()
          for i in order:
              v = views[i]
              s = v.get("byteOffset", 0)
              chunk = png_bytes if i == view_idx else old_bin[s : s + v["byteLength"]]
              new_bin.extend(b"\x00" * ((-len(new_bin)) % 4))
              v["byteOffset"] = len(new_bin)
              v["byteLength"] = len(chunk)
              new_bin.extend(chunk)

          image["mimeType"] = "image/png"
          gltf["buffers"][0]["byteLength"] = len(new_bin)

          json_bytes = json.dumps(gltf, separators=(",", ":")).encode()
          json_bytes += b" " * ((-len(json_bytes)) % 4)
          bin_bytes = bytes(new_bin) + b"\x00" * ((-len(new_bin)) % 4)

          out = bytearray()
          out += struct.pack("<4sII", b"glTF", 2, 12 + 8 + len(json_bytes) + 8 + len(bin_bytes))
          out += struct.pack("<I4s", len(json_bytes), b"JSON") + json_bytes
          out += struct.pack("<I4s", len(bin_bytes), b"BIN\x00") + bin_bytes

          out_glb = Path("Chibi_pretty_8K_Lossless.glb")
          out_glb.write_bytes(bytes(out))
          print(f"Created {out_glb.name}: {len(out)} bytes")

          # Textures ZIP
          tex_dir = next(pkg.rglob("skin_basecolor.png")).parent
          with zipfile.ZipFile("Chibi_pretty_8K_Textures_Lossless.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in tex_dir.glob("*.png"):
                  z.write(p, arcname=p.name)
                  print("Added texture:", p.name)

          # Previews ZIP
          prev_matches = list(pkg.rglob("Chibi_pretty_front.png"))
          if prev_matches:
              prev_dir = prev_matches[0].parent
              with zipfile.ZipFile("Chibi_pretty_Previews.zip", "w", zipfile.ZIP_DEFLATED) as z:
                  for p in prev_dir.glob("*.png"):
                      z.write(p, arcname=p.name)
                      print("Added preview:", p.name)

          # Copy blend, stl, report
          shutil.copy(next(pkg.rglob("Chibi_pretty.blend")), "Chibi_pretty.blend")
          shutil.copy(next(pkg.rglob("Chibi_pretty.stl")), "Chibi_pretty.stl")
          report_matches = list(pkg.rglob("Chibi_pretty_report.json"))
          if report_matches:
              shutil.copy(report_matches[0], "Chibi_pretty_report.json")
          PY

          ls -lh Chibi_pretty*

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || 'v0.0.0.0.0.0-s0' }}"
          echo "Uploading assets to release $TAG..."
          gh release upload "$TAG" \
            Chibi_pretty_8K_Lossless.glb \
            Chibi_pretty.blend \
            Chibi_pretty.stl \
            Chibi_pretty_8K_Textures_Lossless.zip \
            Chibi_pretty_Previews.zip \
            Chibi_pretty_report.json \
            --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || 'v0.0.0.0.0.0-s0' }}"
          gh release view "$TAG"

      - name: Upload v0.0.0.0.0.0-s1 assets if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "Chibi_s1_fused.stl" ]; then
            echo "Uploading assets to release v0.0.0.0.0.0-s1..."
            gh release upload "v0.0.0.0.0.0-s1" \
              Chibi_s1_fused.stl \
              Chibi_hair.stl \
              preview/chibi_s1_color_preview.png \
              preview/chibi_s1_preview.png \
              --clobber
            gh release view "v0.0.0.0.0.0-s1"
          fi
